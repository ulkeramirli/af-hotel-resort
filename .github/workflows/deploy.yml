name: Deploy AFHotel

on:
  push:
    branches:
      - Ali-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /var/www/afhotel

            git pull origin Ali-backend

            npm install

            npm run build

            pm2 restart afhotel